<!doctype html>
<!-- Shown while the bundled server starts; src-tauri/src/sidecar.rs then navigates away. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compooss</title>
    <style>
      :root {
        --bg: #f5f7f8;
        --fg: #1b2226;
        --muted: #66737a;
        --track: #dde3e6;
        --accent: #1b2226;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1f21;
          --fg: #e3e7e9;
          --muted: #87949a;
          --track: #2e3337;
          --accent: #e3e7e9;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        user-select: none;
        cursor: default;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      svg {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .bar {
        width: 160px;
        height: 3px;
        border-radius: 3px;
        background: var(--track);
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: var(--accent);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="100 100 824 824" aria-hidden="true">
        <rect x="100" y="100" width="824" height="824" rx="185" fill="#1b1f22" />
        <path
          fill="#fff"
          d="M512 236C585 312 650 410 652 530 654 640 594 716 512 748 430 716 370 640 372 530 374 410 439 312 512 236Z"
        />
        <path fill="#15191c" d="M512 378 521 700 503 700Z" />
        <rect x="502" y="700" width="20" height="96" rx="5" fill="#fff" />
      </svg>
      <h1>Compooss</h1>
      <div class="bar" role="progressbar" aria-label="Starting"></div>
      <p>Starting…</p>
    </main>
  </body>
</html>
